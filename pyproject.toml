[project]
name = "steproute"
version = "1.0.0"
description = "steproute：面向多步 Agent 的步级动态模型路由与调度（Jev + Runtime Scheduler，Cache/Failure-aware）"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "steproute" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "rich>=13.7",
    "tenacity>=8.3",
    "numpy>=1.26",
    "typer>=0.12",
    "keyring>=25.2",
    "cryptography>=42.0",
]

[project.optional-dependencies]
ui = ["gradio>=4.44"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
steproute = "steproute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steproute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008：typer/Option 在默认参数里调用是框架约定用法
# UP042：保留 str+Enum，避免 StrEnum 改变 str() 语义
ignore = ["E501", "B008", "UP042"]