# Jev：判断"当前 Agent 步骤最低需要哪种能力"
#
# mode:
#   heuristic —— 纯特征加权打分，零额外调用
#   llm       —— 每步都调用最便宜模型做结构化判断
#   hybrid    —— 启发式先跑，难度分落在阈值临界区时才调用 LLM 兜底（默认，性价比最高）
mode: hybrid

# 难度分 → 能力档：<t0 => fast；<t1 => balanced；否则 strong
tier_thresholds: [0.34, 0.66]

# hybrid 模式下，难度分距阈值 <= band 时触发 LLM 兜底
hybrid_band: 0.08
llm_judge_tier: fast
llm_judge_max_tokens: 384

# 步级特征权重（乘到 0~1 的归一化特征上，累加到基础难度）
# 注意 context_len 权重故意很小：输入长度并不能代表难度。
feature_weights:
  context_len: 0.06
  depth: 0.06
  failures: 0.08
  no_progress: 0.08
  evidence_gap: 0.10
  multi_source: 0.08
  numeric_conflict: 0.18
  ambiguity: 0.14
  staleness: 0.08

# 步骤类型 → 基础难度 / 能力下限
step_classifier:
  base_difficulty:
    retrieve: 0.10
    read: 0.12
    extract: 0.18
    compare: 0.55
    analyze: 0.72
    synthesize: 0.60
    final: 0.65
  min_tier:
    retrieve: fast
    read: fast
    extract: fast
    compare: balanced
    analyze: strong
    synthesize: balanced
    final: balanced

# Failure-aware：失败 / 无进展时自动升级能力档
escalation:
  enabled: true
  consecutive_failures: 2
  no_progress_streak: 2
  max_bump: 1